global:
  scrape_interval: 15s # Как часто собирать метрики (по умолчанию)

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090'] # Сам Prometheus опрашивает себя же
  - job_name: 'cadvisor'
    scrape_interval: 5s
    static_configs:
      - targets:
        - cadvisor:8080
