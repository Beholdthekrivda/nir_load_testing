services:
  k6:
    build:
      context: ./k6
      dockerfile: Dockerfile
    image: grafana_k6
    container_name: k6_xk6
    networks:
      - shop-net
    volumes:
      - ./k6:/script
    # environment:
      # K6_KAFKA_BROKERS: kafka:9092
 
  prometheus:
    image: dhi.io/prometheus:3
    container_name: prometheus
    ports:
      - 9090:9090
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

 # cadvisor:
 # image: gcr.io/cadvisor/cadvisor:latest
 #  ports:
 #    - 8080:8080
 #  volumes:
 #    - /:/rootfs:ro
 #    - /var/run:/var/run:rw
 #    - /sys:/sys:ro
 #    - /var/lib/docker/:/var/lib/docker:ro
 #  depends_on:
 #    - prometheus

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.13
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 1
    networks:
      - shop-net
    healthcheck:
      test: ["CMD-SHELL", "echo stat | nc localhost 2181"]
      interval: 30s
      timeout: 10s
      retries: 3

  kafka:
    image: confluentinc/cp-kafka:7.6.13
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 1
    networks:
      - shop-net
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  worker:
    build: ./worker
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:9092
    networks:
      - shop-net

networks:
  shop-net:
    name: shop_net
